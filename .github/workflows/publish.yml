name: Publish npm package

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prepare package tools
        run: npm install --global npm@11 pnpm@11.4.0
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `release/${version}`);
          JS
      - run: pnpm install --frozen-lockfile
      - name: Check package contents
        run: npm pack --dry-run
      - run: pnpm test
      - name: Check published version
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (!response.ok && response.status !== 404) throw new Error(`Registry returned ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          JS
      - name: Publish with OIDC
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/
