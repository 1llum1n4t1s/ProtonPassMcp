name: Publish npm package

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Prepare native Node build toolchain
        shell: pwsh
        run: ./scripts/Initialize-NodeBuild.ps1 -Version '26.13.0' -NpmVersion '12.2.1' -PnpmVersion '12.15.0'

      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `release/${version}`);
          JS
      - run: pnpm install --frozen-lockfile
      - name: Check package contents
        run: npm pack --dry-run
      - run: pnpm test
      - name: Package and verify publish artifact
        id: package
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const packed = JSON.parse(execFileSync('npm', ['pack', '--json', '--pack-destination', process.env.RUNNER_TEMP], { encoding: 'utf8' }));
          const [artifact] = Array.isArray(packed) ? packed : Object.values(packed);
          const filename = path.join(process.env.RUNNER_TEMP, artifact.filename);
          const { integrity } = artifact;
          const archive = JSON.parse(execFileSync('tar', ['-xOf', filename, 'package/package.json'], { encoding: 'utf8' }));
          assert.equal(archive.name, manifest.name);
          assert.equal(archive.version, manifest.version);
          const files = execFileSync('tar', ['-tzf', filename], { encoding: 'utf8' }).trim().split('\n');
          for (const required of ['package.json', 'README.md', 'CHANGELOG.md', 'src/cli.mjs', 'src/server.mjs', 'src/handoff-consumer.mjs']) {
            assert.ok(files.includes(`package/${required}`), `Missing package file: ${required}`);
          }
          const readme = execFileSync('tar', ['-xOf', filename, 'package/README.md'], { encoding: 'utf8' });
          assert.ok(readme.includes(`${manifest.name}@${manifest.version}`));
          assert.equal(`sha512-${createHash('sha512').update(readFileSync(filename)).digest('base64')}`, integrity);
          console.log(JSON.stringify({ name: archive.name, version: archive.version, filename, integrity }));
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${filename}\nintegrity=${integrity}\n`);
          JS
      - name: Validate native npm publisher contracts
        shell: pwsh
        run: ./scripts/Test-NpmPublisher.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'npm-publisher-contracts')
      - name: Publish verified artifact with native OIDC
        shell: pwsh
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
          EXPECTED_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: ./scripts/Publish-Npm.ps1 -PackageFile $env:PACKAGE_FILE -ExpectedIntegrity $env:EXPECTED_INTEGRITY
