name: Publish npm package

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - name: Check release version
        run: |
          bun - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `release/${version}`);
          JS
      - run: bun install --frozen-lockfile --no-save
      - name: Check package contents
        run: bun pm pack --dry-run
      - run: bun test
      - name: Validate Node compatibility
        run: |
          node -e "if (process.versions.bun || process.version !== 'v26.13.0') process.exit(1)"
          node --test test/*.test.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.0.0'
      - name: Validate minimum Node version
        run: |
          node -e "if (process.versions.bun || process.version !== 'v22.0.0') process.exit(1)"
          node --test test/*.test.mjs
      - name: Package and verify publish artifact
        id: package
        shell: pwsh
        run: |
          $filename = bun pm pack --quiet --destination $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Package creation failed' }
          $verified = ./scripts/Verify-BunPackage.ps1 -PackageFile $filename
          $fixtures = Join-Path $env:RUNNER_TEMP 'package-verifier-fixtures'
          New-Item -ItemType Directory -Path $fixtures | Out-Null
          ./scripts/Test-BunPackageVerifier.ps1 -PackageFile $filename -WorkDirectory $fixtures
          "filename=$($verified.PackageFile)" >> $env:GITHUB_OUTPUT
          "integrity=$($verified.Integrity)" >> $env:GITHUB_OUTPUT
      - name: Validate native npm publisher contracts
        shell: pwsh
        run: ./scripts/Test-NpmPublisher.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'npm-publisher-contracts')
      - name: Publish verified artifact with native token authentication
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
          EXPECTED_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: ./scripts/Publish-Npm.ps1 -PackageFile $env:PACKAGE_FILE -ExpectedIntegrity $env:EXPECTED_INTEGRITY
