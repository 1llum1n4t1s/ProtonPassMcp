name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]') }}
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Validate native npm publisher contracts
        shell: pwsh
        run: ./scripts/Test-NpmPublisher.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'npm-publisher-contracts')
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --no-save
      - name: Validate 1
        run: bun test
      - name: Validate Node compatibility
        run: |
          node -e "if (process.versions.bun || process.version !== 'v26.13.0') process.exit(1)"
          node --test test/*.test.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.0.0'
      - name: Validate minimum Node version
        run: |
          node -e "if (process.versions.bun || process.version !== 'v22.0.0') process.exit(1)"
          node --test test/*.test.mjs
      - name: Validate 2
        run: bun pm pack --dry-run
